name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint every skill
        run: node scripts/check-skills.mjs
      - name: Linter self-test
        run: node scripts/check-skills.test.mjs
      - name: Shellcheck (errors only)
        run: git ls-files '*.sh' | xargs -r shellcheck --severity=error
      - name: Claude Code plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
